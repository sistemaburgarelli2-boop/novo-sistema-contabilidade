/* ==========================================================================
   INSTITUTO BURGARELLI — cabeçalho + hero
   Reconstruído do Figma (node 75:395), a partir do export do Dev Mode.

   COMO ESCALA
   O quadro do Figma tem 2843px de largura, mas os tamanhos de tipo são
   absolutos (160/128/64/50/24px) e não acompanham essa largura. Somados,
   os elementos do cabeçalho ocupam 1805px no tamanho cheio — por isso a
   referência de escala aqui é 1900px, a menor largura em que o desenho
   cabe inteiro:

     - de 1900px para cima  -> tudo no tamanho exato do desenho
     - abaixo de 1900px     -> encolhe proporcionalmente, via min(vw, px)
     - abaixo de  900px     -> layout de duas faixas (bloco @media no fim)

   Cada medida traz o valor original do desenho ao lado, em px.
   ========================================================================== */

:root {
  --navy:        #091D2E;  /* fundo do cabeçalho */
  --azul-botao:  #114061;  /* botão "Já sou aluno" */
  --azul-hover:  #17547F;
  --cinza-fundo: #D9D9D9;  /* fundo da página */
  --branco:      #FFFFFF;

  --titulo: "Oswald", "Archivo Narrow", "Arial Narrow", Arial, sans-serif;
  --texto:  "Jost", "Century Gothic", "Futura", "Segoe UI", system-ui, sans-serif;

  --alt-cabecalho: min(8.7895vw, 167px);
  --pad-esq:       min(6.6316vw, 126px);
  --pad-dir:       min(8.1579vw, 155px);
  --tracking:      min(0.2632vw, 5px);   /* letter-spacing: 5px */
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--cinza-fundo);
  font-family: var(--texto);
  -webkit-font-smoothing: antialiased;
}

/* ---------------------------------------------------------------- LOCKUP
   "INSTITUTO" sobre "BURGARELLI". O margin-top da 2ª linha reproduz a
   distância entre linhas de base medida no vetor: 47.3px no cabeçalho,
   133.4px no hero. */
.lockup {
  display: flex;
  flex-direction: column;
  font-family: var(--titulo);
  font-weight: 700;
  line-height: 1;
  text-transform: uppercase;
  letter-spacing: var(--tracking);
  white-space: nowrap;
}
.lockup > span { display: block; }

/* ------------------------------------------------------------- CABEÇALHO */
.cabecalho {
  position: relative;
  height: var(--alt-cabecalho);          /* 167px */
  background: var(--navy);
  display: flex;
  align-items: center;
  padding-left: var(--pad-esq);          /* 126px */
  padding-right: var(--pad-dir);         /* 155px */
  overflow: hidden;
}

.cabecalho > * { position: relative; }

.cabecalho__marca {
  display: flex;
  align-items: center;
  gap: min(1.2632vw, 24px);              /* 24px */
  color: var(--branco);
  text-decoration: none;
  flex-shrink: 0;
}

/* >>> SÍMBOLO DA MARCA <<<
   118x118 no desenho. O export do Figma trouxe apenas um placeholder, então
   não havia arquivo para embutir: o espaço está reservado e o img é
   transparente. Troque o `src` no HTML pelo logo definitivo. */
.cabecalho__simbolo {
  width:  min(6.2105vw, 118px);
  height: min(6.2105vw, 118px);
  flex-shrink: 0;
  object-fit: contain;
}

.cabecalho__marca .l1 { font-size: min(3.3684vw, 64px); }   /* 64px */
.cabecalho__marca .l2 {
  font-size: min(2.6316vw, 50px);                            /* 50px */
  margin-top: min(-0.1811vw, -3.44px);
}

/* ------------------------------------------------------------------ MENU */
.menu {
  display: flex;
  align-items: center;
  gap: min(6.0263vw, 114.5px);
  margin-left: auto;   /* joga menu + botão para a direita, como no desenho */
}
.menu__link {
  font-family: var(--titulo);
  color: var(--branco);
  text-decoration: none;
  font-size: min(1.2632vw, 24px);        /* 24px */
  font-weight: 700;
  letter-spacing: var(--tracking);
  margin-right: calc(-1 * var(--tracking));  /* tira a folga que o
                                                letter-spacing deixa depois
                                                da última letra */
  text-transform: uppercase;
  white-space: nowrap;
  transition: opacity 0.18s ease;
}
.menu__link:hover,
.menu__link:focus-visible { opacity: 0.62; }

/* ---------------------------------------------------------------- BOTÃO */
.botao-aluno {
  flex-shrink: 0;
  margin-left: min(10.7368vw, 204px);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: min(1.6316vw, 31px);
  width:  min(16.4211vw, 312px);         /* 312px */
  height: min(3.1579vw, 60px);           /*  60px */
  border-radius: min(0.7368vw, 14px);    /*  14px */
  background: var(--azul-botao);
  font-family: var(--titulo);
  color: var(--branco);
  text-decoration: none;
  font-size: min(1.2632vw, 24px);
  font-weight: 700;
  letter-spacing: var(--tracking);
  text-transform: uppercase;
  white-space: nowrap;
  transition: background 0.18s ease, transform 0.12s ease;
}
.botao-aluno span { margin-right: calc(-1 * var(--tracking)); }
.botao-aluno:hover,
.botao-aluno:focus-visible { background: var(--azul-hover); }
.botao-aluno:active { transform: translateY(1px); }

.botao-aluno__icone {
  width:  min(1.8947vw, 36px);           /* 36px */
  height: min(1.8947vw, 36px);
  flex-shrink: 0;
  object-fit: contain;
}

/* ------------------------------------------------------------------ HERO */
.hero {
  position: relative;
  height: min(37.5789vw, 714px);         /* 714px */
  overflow: hidden;
}

/* >>> IMAGEM DE FUNDO DO HERO <<<
   No desenho este espaço também é placeholder (2843x714), então não veio
   arte. Troque o `background-image` por url("suaimagem.jpg") ou um data URI. */
.hero__midia {
  position: absolute;
  inset: 0;
  background-color: #F4F4F4;
  background-image: none;
  background-size: cover;
  background-position: center;
}

.hero__conteudo {
  position: relative;
  height: 100%;
  padding-left: min(7.6842vw, 146px);    /* 146px */
  padding-top:  min(10.0579vw, 191.1px);
}
.hero__titulo {
  margin: 0;
  color: #000;
}
.hero__titulo .l1 { font-size: min(8.4211vw, 160px); }   /* 160px */
.hero__titulo .l2 {
  font-size: min(6.7368vw, 128px);                        /* 128px */
  margin-top: min(0.2vw, 3.8px);
}

.hero__descricao {
  margin: min(2.4579vw, 46.7px) 0 0;
  max-width: min(31.0vw, 589px);         /* 589px */
  font-family: var(--texto);
  font-weight: 500;
  font-size: min(1.0526vw, 20px);        /*  20px */
  line-height: 1.62;                     /* 32.4px / 20px */
  color: rgba(0, 0, 0, 0.80);
}

/* ------------------------------------------------------------ RESPONSIVO
   O Figma só tem a versão desktop. Abaixo de 900px o cabeçalho passa a
   duas faixas para o menu não espremer a marca. */
@media (max-width: 900px) {
  :root { --tracking: 3px; }

  .cabecalho {
    height: auto;
    flex-wrap: wrap;
    padding: 16px 22px;
    row-gap: 14px;
  }
  .cabecalho::before {
    background-size: auto 780px;
    background-position: 0 -315px;
  }
  .cabecalho__marca { gap: 12px; }
  .cabecalho__simbolo { width: 52px; height: 52px; }
  .cabecalho__marca .l1 { font-size: 30px; }
  .cabecalho__marca .l2 { font-size: 23.4px; margin-top: -1.6px; }

  .menu {
    order: 3;
    width: 100%;
    margin-left: 0;
    justify-content: space-between;
    gap: 14px;
  }
  .menu__link { font-size: 13px; }

  .botao-aluno {
    margin-left: auto;
    width: auto;
    height: 44px;
    padding: 0 16px;
    gap: 10px;
    border-radius: 10px;
    font-size: 13px;
  }
  .botao-aluno__icone { width: 24px; height: 24px; }

  .hero { height: auto; }
  .hero__conteudo { padding: 64px 22px 72px; }
  .hero__titulo .l1 { font-size: min(13.6vw, 110px); }
  .hero__titulo .l2 { font-size: min(10.88vw, 88px); margin-top: 2px; }
  .hero__descricao { margin-top: 28px; max-width: 100%; font-size: 16px; }
}

/* Celular: no tamanho anterior a marca e o botão somados passavam da
   largura da tela e criavam rolagem horizontal. */
@media (max-width: 560px) {
  :root { --tracking: 2px; }

  .cabecalho { padding: 14px 18px; }
  .cabecalho__marca { gap: 10px; }
  .cabecalho__simbolo { width: 40px; height: 40px; }
  .cabecalho__marca .l1 { font-size: 22px; }
  .cabecalho__marca .l2 { font-size: 17.2px; margin-top: -1.2px; }

  .menu__link { font-size: 11px; }

  .botao-aluno {
    height: 38px;
    padding: 0 12px;
    gap: 8px;
    border-radius: 8px;
    font-size: 11px;
  }
  .botao-aluno__icone { width: 20px; height: 20px; }

  .hero__conteudo { padding: 44px 18px 52px; }
  .hero__titulo .l1 { font-size: min(13.6vw, 110px); }
  .hero__titulo .l2 { font-size: min(10.88vw, 88px); }
  .hero__descricao { margin-top: 22px; font-size: 15px; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
